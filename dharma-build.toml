# Dharma's OWN self-tooling config: building/testing the dharma workspace and
# keeping its docs/raw compliant. Has no MCP protocol role — see
# docs/proposal/11-provider-config-and-repo-sync.md, "Dharma Build Config".
# Read in place from here (repo root) by crates/xtask
# (scripts/build-release.{sh,ps1}). Template: config.example/dharma-build.toml.

[repository]
id = "dharma"
name = "dharma"
uuid = "00000000-0000-0000-0000-000000000000"  # replace with a real uuid

[repository.ignore]
patterns = [
    "**/node_modules/**",
    "**/target/**",
    "**/.git/**",
    "**/archive/**",
]

[repository.documentation]
# Absolute path resolved from DHARMA_DOCS_DIR (see env/dharma-build.env.example)
# — falls back to <repo>/docs if unset.
root_dir = "${DHARMA_DOCS_DIR}"
# The doc-type standards this repository maintains under docs/raw/ — see
# docs/raw/crates.md for why "crates" is its own type, not folded into
# "architecture".
domain = ["architecture", "build", "engineering", "implementation", "qa", "crates", "proposal"]

[repository.implementation]
# The Cargo workspace root — resolves to "crates" via env.
dir = "${DHARMA_IMPLEMENTATION_DIR}"

[pipelines.build]
command = ["cargo", "build", "--release", "--workspace"]
working_directory = "${PROJECT_ROOT}"
description = "Build every crate in the workspace"
produces = ["release binaries: cli, mcp"]
consumes = ["source code", "dependencies"]

[pipelines.test]
command = ["cargo", "test", "--workspace"]
working_directory = "${PROJECT_ROOT}"
description = "Run unit + integration tests across the workspace"
produces = ["test results"]
consumes = ["source code"]

[package]
# Where crates/xtask drops the packaged release (bin/, config/, env/,
# schema/). Falls back to <repo>/release if DHARMA_BUILD_OUTPUT_DIR is unset.
output_dir = "${DHARMA_BUILD_OUTPUT_DIR}"
# Validity window baked into dharma-mcp at compile time (crates/mcp/build.rs)
# — the packaged binary refuses to start once expired. expiry_days = -1
# means the build never expires. Override per-build via .env
# (env/dharma-build.env.example); defaults to 30 days, 0 hours if unset.
expiry_days = "${DHARMA_BUILD_EXPIRY_DAYS:-30}"
expiry_hours = "${DHARMA_BUILD_EXPIRY_HOURS:-0}"

[report]
# Base dir for generated reports. Falls back to <repo>/docs/report if
# DHARMA_REPORT_DIR is unset.
dir = "${DHARMA_REPORT_DIR}"
