# Real (not example) provider config — read by xtask's Release Bundling
# Step (docs/proposal/16-agent-system-concern-split-and-release-bundling.md),
# never by the runtime MCP server. Registers the `agent-system-evaluation`
# concern — provider-owned per proposal 16, its source content is not
# authored or stored by this repository. `root_dir` below does not exist in
# Kriti (or any provider) yet; this entry is skipped by the Release
# Bundling Step until a provider publishes content there.
# Referenced from dharma-build.toml's [[release.providers]].

[agent_system]
name = "agent-system-evaluation"
concern = "agent-system-evaluation"
description = "Judges whether a registered Agent System's own Agents/Skills/bindings are good"
is_privileged_request = false

[agent_system.content]
root_dir = "${DHARMA_AGENT_AGENT_SYSTEM_EVALUATION_CONTENT_DIR:-/home/dell/PycharmProjects/Kriti/dharma/agent/system/agent-system-evaluation}"
